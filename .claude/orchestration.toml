[settings]
maxParallelAgents = 6
defaultModel = "sonnet"
modelProfile = "quality"
persistHistory = true
dataFormat = "toon"

[settings.profiles.quality]
planning = "opus"
execution = "opus"
review = "opus"
verification = "sonnet"
utility = "sonnet"

[settings.profiles.balanced]
planning = "opus"
execution = "sonnet"
review = "sonnet"
verification = "sonnet"
utility = "haiku"

[settings.profiles.budget]
planning = "sonnet"
execution = "sonnet"
review = "haiku"
verification = "haiku"
utility = "haiku"

[settings.contextBudget]
contextWindow = 200000

[settings.discipline]
# Capability-gated discipline profile — see protocols/discipline.schema.md.
# Resolves to "strict" until /loom-doctor --resolve-profile writes `resolved`.
profile = "auto"

[settings.discipline.tierOverrides]
haiku = "standard"   # cheap-tier subagents keep file-ownership enforcement

[wiki]
enabled = true
path = ".loom/wiki"
maxPages = 500
stalenessDays = 30
archiveThresholdMultiplier = 3
autoLint = true
lintSchedule = "post-wave"

[domain]
type = "code"
contractType = "type-files"
verificationPipeline = ["tsc --noEmit", "bun run lint", "bun test"]

[roadmap.converge]
maxPasses = 3                 # default 3; clamped to max 5
defaultRoadmap = "planning/ROADMAP.md"
stateRoot = ".roadmap-converge"
lockStaleSeconds = 600        # 10 minutes
reviewerModel = "sonnet"      # per C-05 — model for per-dimension reviewers
driverModel = "opus"          # per C-05 — model for converge driver

# Per-project retire-dimension overrides (one-liner per dimension)
retire = []                   # dimensions to skip evaluation entirely

# Optional per-archetype rubric overrides
[roadmap.converge.rubricOverrides]
# "vision" = "protocols/roadmap-rubrics/vision-strict.md"

# Adversarial reviewer (roadmap C-08 / CT6 A1) — default convergence
# participant; registered here per CONTEXT.md D-01 (never hardcoded).
[[review.agents]]
name = "adversary-agent"
source = "agents/adversary-agent.md"
model = "sonnet"
input = ["diff", "plan"]
outputRole = "reviewer"
modes = ["default", "full"]

[execution.agents]
contracts-agent = "agents/contracts-agent.md"
wiring-agent = "agents/wiring-agent.md"
roadmap-converge-driver = "agents/roadmap-converge-driver.md"
roadmap-converge-reviewer = "agents/roadmap-converge-reviewer.md"
roadmap-converge-integrator = "agents/roadmap-converge-integrator.md"
roadmap-archetype-detector = "agents/roadmap-archetype-detector.md"

[settings.decisionPrinciples]
enabled = true
path = "protocols/loom-decision-principles.md"

# Competitive-benchmark pattern (PLAN-thinking-gate P5). The `--benchmark` flag
# on a pre-roadmap think surfaces the semantic label `competitive-benchmark`,
# which matches this trigger and spawns the single benchmark-agent to write a
# BenchmarkScorecard into the think doc. Registering it here (plus the matching
# `### Benchmark` section in protocols/pattern-executor.md and the definition in
# protocols/orchestration-patterns.md) makes `--benchmark` non-inert: the
# executor's Trigger Matching finds this pattern instead of falling back to a
# generic single-agent spawn. Distinct from the `loom-benchmark` perf skill.
[patterns.benchmark]
type = "benchmark"
agent = "benchmark-agent"
trigger = "competitive-benchmark"
